syntax = "proto3";

package bunnymq.v1;

option go_package = "github.com/bunnymq/bunnymq/pkg/proto/v1;bunnymqv1";

enum BunnyErrorCode {
  OK                     = 0;
  UNKNOWN                = 1;
  INVALID_ARGUMENT       = 2;
  TOPIC_NOT_FOUND        = 3;
  TOPIC_ALREADY_EXISTS   = 4;
  PARTITION_NOT_FOUND    = 5;
  NOT_LEADER             = 6;
  OFFSET_OUT_OF_RANGE    = 7;
  MESSAGE_TOO_LARGE      = 8;
  BATCH_TOO_LARGE        = 9;
  UNAUTHENTICATED        = 10;
  UNAVAILABLE            = 11;
  TIMEOUT                = 12;
  INVALID_MESSAGE_FORMAT = 13;
  OFFSET_NOT_FOUND       = 14;
  STALE_GENERATION       = 15;
  NOT_GROUP_MEMBER       = 16;
}

message BunnyErrorDetail {
  BunnyErrorCode code    = 1;
  string         message = 2;
}

message NotLeaderDetail {
  uint64 leader_node_id  = 1;
  string leader_address  = 2;
}
