services:
  broker1:
    build: .
    hostname: broker1
    environment:
      NODE_ID: "1"
      RAFT_ADDR: "broker1:7001"
      MGMT_ADDR: ":9091"
      DATA_ADDR: ":9092"
      ADVERTISE_DATA_ADDR: "localhost:19092"
      METRICS_ADDR: ":9090"
      DATA_DIR: "/data"
      INITIAL_MEMBERS: "1=broker1:7001,2=broker2:7001,3=broker3:7001"
      GROUP_SWEEP_INTERVAL_MS: "3000"
      RETENTION_CHECK_INTERVAL_MS: "5000"
    ports:
      - "19091:9091"
      - "19092:9092"
      - "19090:9090"
    volumes:
      - broker1-data:/data
    healthcheck:
      test: ["CMD", "/bunnymq", "--health-check"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  broker2:
    build: .
    hostname: broker2
    environment:
      NODE_ID: "2"
      RAFT_ADDR: "broker2:7001"
      MGMT_ADDR: ":9091"
      DATA_ADDR: ":9092"
      ADVERTISE_DATA_ADDR: "localhost:29092"
      METRICS_ADDR: ":9090"
      DATA_DIR: "/data"
      INITIAL_MEMBERS: "1=broker1:7001,2=broker2:7001,3=broker3:7001"
      GROUP_SWEEP_INTERVAL_MS: "3000"
      RETENTION_CHECK_INTERVAL_MS: "5000"
    ports:
      - "29091:9091"
      - "29092:9092"
      - "29090:9090"
    volumes:
      - broker2-data:/data
    healthcheck:
      test: ["CMD", "/bunnymq", "--health-check"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  broker3:
    build: .
    hostname: broker3
    environment:
      NODE_ID: "3"
      RAFT_ADDR: "broker3:7001"
      MGMT_ADDR: ":9091"
      DATA_ADDR: ":9092"
      ADVERTISE_DATA_ADDR: "localhost:39092"
      METRICS_ADDR: ":9090"
      DATA_DIR: "/data"
      INITIAL_MEMBERS: "1=broker1:7001,2=broker2:7001,3=broker3:7001"
      GROUP_SWEEP_INTERVAL_MS: "3000"
      RETENTION_CHECK_INTERVAL_MS: "5000"
    ports:
      - "39091:9091"
      - "39092:9092"
      - "39090:9090"
    volumes:
      - broker3-data:/data
    healthcheck:
      test: ["CMD", "/bunnymq", "--health-check"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 15s

  prometheus:
    image: prom/prometheus:v3.4.0
    hostname: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
      broker3:
        condition: service_healthy

  grafana:
    image: grafana/grafana:12.0.1
    hostname: grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  broker1-data:
  broker2-data:
  broker3-data:
  prometheus-data:
  grafana-data:
