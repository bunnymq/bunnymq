global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: bunnymq
    static_configs:
      - targets:
          - broker1:9090
          - broker2:9090
          - broker3:9090
    relabel_configs:
      - source_labels: [__address__]
        regex: '(broker\d+):.*'
        target_label: instance
        replacement: '${1}'
